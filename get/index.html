<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening the App Store – Ping Drop</title>
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/gb/app/ping-drop/id6828077671">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Optional campaign tracking: /get/?c=reddit. Set PT to the provider token from App Store
    // Connect (Analytics > Campaigns) to tag the visit; with PT empty the link is untagged.
    (function () {
      var PT = "";
      var url = "https://apps.apple.com/gb/app/ping-drop/id6828077671";
      var c = (new URLSearchParams(location.search).get("c") || "").toLowerCase();
      if (PT && /^[a-z0-9_-]{1,40}$/.test(c)) url += "?pt=" + PT + "&ct=" + c + "&mt=8";
      window.location.replace(url);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening the App Store…</h1>
    <p>If nothing happens, search for <strong>Ping Drop</strong> in the App Store, or <a href="https://apps.apple.com/gb/app/ping-drop/id6828077671">open it here</a>.</p>
    <p><a href="/">Back to Ping Drop</a></p>
  </main>
</body>
</html>
